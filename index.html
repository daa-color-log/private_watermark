<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Watermark - Batch Edition</title>
  <!-- ExifReader CDN -->
  <script src="https://cdn.jsdelivr.net/npm/exifreader@4.20.0/dist/exif-reader.min.js"></script>
  <style>
    :root {
      --primary-color: #00c73c;
      --primary-hover: #00b135;
      --bg-color: #1a1c22;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-sub: #666666;
      --border-color: #e1e4e8;
      --shadow: 0 8px 30px rgba(0,0,0,0.3);
      --danger-color: #ff4d4f;
      --danger-hover: #d9363e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: clamp(10px, 3vw, 30px);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-color);
      background-image: radial-gradient(#2d313a 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .card {
      background: var(--card-bg);
      padding: clamp(16px, 4vw, 36px);
      border-radius: clamp(16px, 2.5vw, 28px);
      box-shadow: var(--shadow);
      overflow: hidden;
      width: 100%;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: clamp(16px, 3vw, 24px);
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title-group {
      text-align: left;
    }

    h1 {
      margin: 0 0 0.2em 0;
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    
    .subtitle {
      color: var(--text-sub);
      font-size: clamp(12px, 1.5vw, 15px);
      margin: 0;
    }

    .lang-select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lang-select {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background-color: #f8f9fa;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
    }

    .lang-select:focus {
      border-color: var(--primary-color);
    }

    .main-layout {
      display: flex;
      gap: clamp(16px, 3vw, 36px);
      align-items: flex-start;
      width: 100%;
    }

    .controls-side {
      flex: 1 1 340px;
      min-width: 0;
      width: 100%;
    }

    .preview-side {
      flex: 1 1 400px;
      min-width: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form-group {
      margin-bottom: clamp(12px, 2vw, 20px);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.5em;
      font-size: clamp(13px, 1.2vw, 15px);
      color: var(--text-main);
    }

    .file-upload-wrapper {
      position: relative;
      width: 100%;
    }
    
    input[type="file"] {
      display: none;
    }
    
    .file-upload-label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: clamp(16px, 2vw, 24px);
      background-color: #f0f2f5;
      border: 2px dashed var(--border-color);
      border-radius: clamp(8px, 1vw, 12px);
      cursor: pointer;
      color: var(--text-sub);
      font-size: clamp(13px, 1.2vw, 15px);
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
      word-break: break-all;
    }
    
    .file-upload-label:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
      background-color: #f0fff4;
    }

    .file-upload-label.dragover {
      border-color: var(--primary-color);
      background-color: #e6f9ed;
      color: var(--primary-color);
      transform: scale(1.01);
    }

    input[type="text"], select {
      width: 100%;
      padding: clamp(10px, 1.2vw, 14px) clamp(12px, 1.5vw, 16px);
      border: 1px solid var(--border-color);
      border-radius: clamp(8px, 1vw, 12px);
      font-size: clamp(13px, 1.2vw, 15px);
      transition: all 0.2s ease;
      background-color: #fbfcfd;
      color: var(--text-main);
    }
    
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(0, 199, 60, 0.1);
      background-color: #ffffff;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5em;
      font-size: clamp(12px, 1.1vw, 14px);
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      margin-top: 0.6em;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: clamp(14px, 1.3vw, 18px);
      height: clamp(14px, 1.3vw, 18px);
      accent-color: var(--primary-color);
      cursor: pointer;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.2vw, 16px);
    }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: clamp(4px, 0.5vw, 8px);
      background: #e1e4e8;
      border-radius: 5px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: clamp(16px, 1.5vw, 22px);
      height: clamp(16px, 1.5vw, 22px);
      background: var(--primary-color);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    .row {
      display: flex;
      gap: clamp(8px, 1.5vw, 16px);
      flex-wrap: wrap;
    }

    .col {
      flex: 1 1 140px;
      min-width: 0;
    }

    /* Canvas Area */
    .canvas-container {
      position: relative;
      width: 100%;
      border-radius: clamp(10px, 1.5vw, 18px);
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: none;
      background-color: #f8f9fa;
    }

    .canvas-container canvas {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      display: block;
    }

    .single-exif-box {
      width: 100%;
      background: #f8f9fa;
      padding: clamp(8px, 1vw, 14px);
      border-radius: clamp(8px, 1vw, 12px);
      font-size: clamp(11px, 1vw, 13px);
      color: var(--text-sub);
      margin-top: 10px;
      border: 1px solid var(--border-color);
      line-height: 1.5;
      word-break: break-all;
      display: none;
    }

    /* Top Bar for Preview Area */
    .preview-header-bar {
      width: 100%;
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5em;
    }

    .grid-header {
      font-weight: 700;
      font-size: clamp(13px, 1.2vw, 15px);
      margin: 0;
      text-align: left;
    }

    .btn-clear {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-clear:hover {
      background-color: #fff1f0;
      border-color: var(--danger-color);
      color: var(--danger-color);
    }

    /* Thumbnail Grid Area */
    .thumbnail-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      padding: 4px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      display: none;
    }

    .thumb-card {
      position: relative;
      background: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.2s ease;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 199, 60, 0.2);
    }

    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      color: white;
    }

    .thumb-card:hover .thumb-overlay {
      opacity: 1;
    }

    /* 썸네일 개별 삭제 버튼 */
    .thumb-remove-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0.8;
      transition: all 0.2s ease;
    }

    .thumb-card:hover .thumb-remove-btn {
      opacity: 1;
    }

    .thumb-remove-btn:hover {
      background: var(--danger-color);
      transform: scale(1.15);
    }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: transparent;
    }

    .modal-actions {
      position: absolute;
      top: -45px;
      right: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      height: 36px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
      font-size: 13px;
      font-weight: 600;
      padding: 0 12px;
      gap: 4px;
    }

    .modal-btn:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .modal-btn-delete {
      background: rgba(255, 77, 79, 0.8);
    }

    .modal-btn-delete:hover {
      background: rgba(255, 77, 79, 1);
    }

    .modal-close-btn {
      width: 36px;
      padding: 0;
      border-radius: 50%;
    }

    .modal-canvas-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background-color: #f8f9fa;
    }

    .modal-canvas-container canvas {
      width: auto;
      height: auto;
      max-width: 85vw;
      max-height: 75vh;
      object-fit: contain;
      display: block;
    }

    .modal-exif-info {
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      text-align: center;
      line-height: 1.4;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
    }

    .btn-download {
      width: 100%;
      padding: clamp(12px, 1.5vw, 18px);
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: clamp(10px, 1.2vw, 16px);
      font-weight: 700;
      font-size: clamp(14px, 1.3vw, 17px);
      cursor: pointer;
      margin-top: clamp(12px, 1.5vw, 20px);
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 199, 60, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-download:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-download:disabled {
      background-color: #ccd0d5;
      color: #8a9199;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    @media (max-width: 768px) {
      .main-layout {
        flex-direction: column;
      }

      .header-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="header-bar">
      <div class="header-title-group">
        <h1 id="titleText">Watermark</h1>
        <p class="subtitle" id="subtitleText">Protect your photos with customizable watermarks</p>
      </div>
      <div class="lang-select-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <select id="langSelect" class="lang-select">
          <option value="en">English</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </div>
    
    <div class="main-layout">
      <div class="controls-side">
        <div class="form-group">
          <label id="lblSelectImages">1. Select Images (Multiple)</label>
          <div class="file-upload-wrapper">
            <label for="upload" class="file-upload-label" id="fileLabel">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; flex-shrink: 0;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span id="dropText">Drop images here or click to upload (or Paste with Ctrl+V)</span>
            </label>
            <input type="file" id="upload" accept="image/*" multiple>
          </div>
        </div>

        <div class="form-group">
          <label id="lblCustomText">2. Watermark Text / Name (Auto-saved)</label>
          <input type="text" id="customText" placeholder="e.g., Photo by John Doe">
          
          <label class="checkbox-label">
            <input type="checkbox" id="includeExifCheckbox" checked>
            <span id="lblIncludeExif">Include EXIF Info (Camera, Lens & Settings)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="instantFrameCheckbox">
            <span id="lblInstantFrame">Instant Photo Style (Add White Bottom Frame)</span>
          </label>
        </div>

        <div class="form-group" id="positionGroup">
          <label id="positionLabel">3. Watermark Position</label>
          <select id="watermarkPosition">
            <!-- Dynamic Options -->
          </select>
        </div>

        <div class="row">
          <div class="col form-group">
            <label id="lblMaxRes">4. Max Resolution</label>
            <select id="maxResolution">
              <option value="0" id="optResOrig">Original Size</option>
              <option value="1920">1920px (FHD)</option>
              <option value="1280" selected id="optResRec">1280px (Recommended)</option>
              <option value="800" id="optResComp">800px (Compact)</option>
            </select>
          </div>

          <div class="col form-group">
            <label><span id="lblQuality">5. Quality</span> (<span id="qualityVal">75</span>%)</label>
            <div class="slider-container" style="padding-top: 8px;">
              <input type="range" id="qualitySlider" min="10" max="100" value="75">
            </div>
          </div>
        </div>

        <div class="form-group">
          <label><span id="lblOpacity">6. Opacity</span> (<span id="opacityVal">25</span>%)</label>
          <div class="slider-container">
            <input type="range" id="opacitySlider" min="5" max="80" value="25">
          </div>
        </div>
      </div>

      <div class="preview-side">
        <!-- Top Control Bar (Header & Clear Button) -->
        <div id="previewHeaderBar" class="preview-header-bar">
          <div class="grid-header" id="lblGridHeader">Preview</div>
          <button id="clearBtn" class="btn-clear">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span id="lblClearBtn">Clear All</span>
          </button>
        </div>

        <!-- Single Image Direct Canvas Preview -->
        <div class="canvas-container" id="singleCanvasContainer">
          <canvas id="singleCanvas"></canvas>
        </div>
        <div id="singleExifBox" class="single-exif-box"></div>

        <!-- Multi Image Thumbnail Grid -->
        <div id="thumbnailGrid" class="thumbnail-grid"></div>

        <button id="downloadBtn" class="btn-download" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; vertical-align: middle; flex-shrink: 0;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span id="downloadBtnText">Download (JPG)</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Overlay for Multi Image Large Preview -->
<div id="previewModal" class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-actions">
      <button id="modalDeleteBtn" class="modal-btn modal-btn-delete" aria-label="Delete Image">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        <span id="lblModalDelete">Delete</span>
      </button>
      <button id="modalCloseBtn" class="modal-btn modal-close-btn" aria-label="Close Preview">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="modal-canvas-container">
      <canvas id="modalCanvas"></canvas>
    </div>
    <div id="modalExifInfo" class="modal-exif-info"></div>
  </div>
</div>

<script>
  const translations = {
    en: {
      subtitle: "Protect your photos with customizable watermarks",
      selectImages: "1. Select Images (Multiple)",
      dropText: "Drop images here, click to upload, or paste with Ctrl+V",
      selectedFiles: "image(s) selected",
      customTextLabel: "2. Watermark Text / Name (Auto-saved)",
      placeholderText: "e.g., Photo by John Doe",
      includeExif: "Include EXIF Info (Camera, Lens & Settings)",
      instantFrame: "Instant Photo Style (Add White Bottom Frame)",
      posLabelNormal: "3. Watermark Position",
      posLabelInstant: "3. Text Alignment (Bottom Frame)",
      gridHeaderSingle: "Preview",
      gridHeaderMulti: "Thumbnails (Click to Preview)",
      clearBtn: "Clear All",
      deleteBtn: "Delete",
      maxRes: "4. Max Resolution",
      resOriginal: "Original Size",
      resRecommended: "1280px (Recommended)",
      resCompact: "800px (Compact)",
      quality: "5. Quality",
      opacity: "6. Opacity",
      exifDetected: "EXIF Detected",
      noExif: "No EXIF metadata detected.",
      btnDownloadSingle: "Download (JPG)",
      btnDownloadMulti: "Download All ({n} files)",
      btnDownloading: "Downloading ({i}/{total})...",
      posNormal: {
        diagonal: "Full Diagonal Grid",
        topLeft: "Top Left",
        bottomLeft: "Bottom Left",
        topRight: "Top Right",
        bottomRight: "Bottom Right"
      },
      posInstant: {
        left: "Left Alignment",
        center: "Center Alignment",
        right: "Right Alignment"
      }
    },
    ko: {
      subtitle: "사진에 나만의 워터마크 및 EXIF 정보 추가하기",
      selectImages: "1. 이미지 선택 (다중 선택 가능)",
      dropText: "이미지를 드래그하거나 클릭하여 업로드 (Ctrl+V 붙여넣기 가능)",
      selectedFiles: "개의 이미지가 선택됨",
      customTextLabel: "2. 워터마크 문구 / 이름 (자동 저장)",
      placeholderText: "예: Photo by 홍길동",
      includeExif: "EXIF 정보 포함 (카메라, 렌즈 및 촬영 옵션)",
      instantFrame: "인스턴트 프레임 (하단 흰색 여백 추가)",
      posLabelNormal: "3. 워터마크 위치",
      posLabelInstant: "3. 텍스트 정렬 (하단 프레임)",
      gridHeaderSingle: "미리보기",
      gridHeaderMulti: "썸네일 목록 (클릭하여 큰 화면 미리보기)",
      clearBtn: "초기화",

  function parseExifData(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const buffer = e.target.result;
          const tags = ExifReader.load(buffer, { expanded: true });

          const getVal = (group, name) => {
            if (tags[group] && tags[group][name] && tags[group][name].description) {
              return String(tags[group][name].description).trim();
            }
            return "";
          };

          const make = getVal('exif', 'Make');
          const model = getVal('exif', 'Model');
          let cameraStr = model;
          if (make && model && !model.toLowerCase().includes(make.toLowerCase())) {
            cameraStr = `${make} ${model}`;
          }

          let lensStr = getVal('exif', 'LensModel') || 
                        getVal('exif', 'Lens') || 
                        getVal('exif', 'LensInfo') || 
                        getVal('exif', 'LensType') ||
                        getVal('exif', 'UndefinedTag:0xA434');

          let cameraLensCombined = cameraStr;
          if (lensStr) {
            if (cameraLensCombined) cameraLensCombined += ` | ${lensStr}`;
            else cameraLensCombined = lensStr;
          }

          const fNumber = getVal('exif', 'FNumber');
          const exposureTime = getVal('exif', 'ExposureTime');
          const iso = getVal('exif', 'ISOSpeedRatings') || getVal('exif', 'PhotographicSensitivity') || getVal('exif', 'ISO');
          const focalLength = getVal('exif', 'FocalLength');

          let exposureParts = [];
          if (fNumber) {
            const cleanF = fNumber.replace(/^f\//i, '');
            exposureParts.push(`f/${cleanF}`);
          }
          if (exposureTime) {
            exposureParts.push(exposureTime.endsWith('s') ? exposureTime : `${exposureTime}s`);
          }
          if (iso) exposureParts.push(`ISO${iso}`);
          if (focalLength) {
            const cleanFL = focalLength.replace(/\s*mm$/i, '');
            exposureParts.push(`${cleanFL}mm`);
          }

          resolve({
            cameraLens: cameraLensCombined,
            settings: exposureParts.join(" ")
          });
        } catch (err) {
          console.warn("ExifReader load error:", err);
          resolve({ cameraLens: "", settings: "" });
        }
      };
      reader.onerror = function() {
        resolve({ cameraLens: "", settings: "" });
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function processFiles(files) {
    const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
    
    if (imageFiles.length === 0) {
      alert('Please select valid image files.');
      return;
    }

    let loadedCount = 0;
    
    imageFiles.forEach(async (file) => {
      const exifObj = await parseExifData(file);

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          loadedFilesData.push({
            name: file.name,
            img: img,
            exifObj: exifObj
          });
          loadedCount++;
          if (loadedCount === imageFiles.length) {
            onAllImagesLoaded();
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function drawWatermarkToCanvas(targetCanvas, targetCtx, imgObj, exifObj) {
    let imgWidth = imgObj.width;
    let imgHeight = imgObj.height;
    const maxRes = parseInt(maxResolution.value, 10);

    if (maxRes > 0 && (imgWidth > maxRes || imgHeight > maxRes)) {
      if (imgWidth > imgHeight) {
        imgHeight = Math.round((imgHeight * maxRes) / imgWidth);
        imgWidth = maxRes;
      } else {
        imgWidth = Math.round((imgWidth * maxRes) / imgHeight);
        imgHeight = maxRes;
      }
    }

    const isInstant = instantFrameCheckbox.checked;
    const instantMargin = isInstant ? Math.round(imgHeight * 0.14) : 0;

    targetCanvas.width = imgWidth;
    targetCanvas.height = imgHeight + instantMargin;

    targetCtx.fillStyle = '#ffffff';
    targetCtx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);

    targetCtx.drawImage(imgObj, 0, 0, imgWidth, imgHeight);

    const lines = [];
    const nameStr = customText.value.trim();
    if (nameStr) lines.push(nameStr);

    if (includeExifCheckbox.checked) {
      if (exifObj.cameraLens) lines.push(exifObj.cameraLens);
      if (exifObj.settings) lines.push(exifObj.settings);
    }

    if (lines.length === 0 && !isInstant) return;

    const alpha = opacitySlider.value / 100;
    const position = watermarkPosition.value;

    if (isInstant) {
      targetCtx.save();
      const fontSize = Math.max(11, Math.floor(instantMargin * 0.20));
      const lineHeight = fontSize * 1.3;
      targetCtx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      targetCtx.fillStyle = `rgba(20, 20, 20, ${Math.max(0.7, alpha)})`;

      const marginX = Math.floor(imgWidth * 0.04);
      let x = imgWidth / 2;
      let textAlign = 'center';

      if (position === 'p-left') {
        x = marginX;
        textAlign = 'left';
      } else if (position === 'p-right') {
        x = imgWidth - marginX;
        textAlign = 'right';
      }

      targetCtx.textAlign = textAlign;
      targetCtx.textBaseline = 'middle';

      const totalBlockHeight = (lines.length - 1) * lineHeight;
      const startY = imgHeight + (instantMargin / 2) - (totalBlockHeight / 2);

      lines.forEach((lineText, idx) => {
        targetCtx.fillText(lineText, x, startY + (idx * lineHeight));
      });

      targetCtx.restore();
      return;
    }

    targetCtx.save();

    if (position === 'diagonal') {
      targetCtx.translate(targetCanvas.width / 2, imgHeight / 2);
      targetCtx.rotate(-30 * Math.PI / 180);

      const fontSize = Math.max(13, Math.floor(imgWidth / 42));
      const lineHeight = fontSize * 1.35;
      targetCtx.font = `bold ${fontSize}px -apple-system, sans-serif`;
      targetCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      targetCtx.strokeStyle = `rgba(0, 0, 0, ${alpha * 0.7})`;
      targetCtx.lineWidth = Math.max(0.5, fontSize / 20);
      targetCtx.textAlign = 'center';

      let maxTextWidth = 0;
      lines.forEach(l => {
        const w = targetCtx.measureText(l).width;
        if (w > maxTextWidth) maxTextWidth = w;
      });

      const diagonal = Math.sqrt(targetCanvas.width * targetCanvas.width + imgHeight * imgHeight);
      const stepX = maxTextWidth + fontSize * 3;
      const stepY = (lines.length * lineHeight) + fontSize * 3;

      let row = 0;
      for (let y = -diagonal; y < diagonal; y += stepY) {
        const shiftX = (row % 2 === 0) ? 0 : stepX / 2;
        for (let x = -diagonal + shiftX; x < diagonal; x += stepX) {
          lines.forEach((lineText, lineIdx) => {
            const lineY = y + (lineIdx * lineHeight);
            targetCtx.strokeText(lineText, x, lineY);
            targetCtx.fillText(lineText, x, lineY);
          });
        }
        row++;
      }
    } else {
      const fontSize = Math.max(12, Math.floor(imgWidth / 45));
      const lineHeight = fontSize * 1.35;
      const marginX = Math.floor(imgWidth * 0.03);
      const marginY = Math.floor(imgHeight * 0.03);

      targetCtx.font = `600 ${fontSize}px -apple-system, sans-serif`;
      targetCtx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, alpha * 1.6)})`;
      targetCtx.strokeStyle = `rgba(0, 0, 0, ${Math.min(1, alpha * 1.2)})`;
      targetCtx.lineWidth = Math.max(1, fontSize / 12);

      let x = marginX;
      let textAlign = 'left';
      let isTop = position.startsWith('top');

      if (position.endsWith('right')) {
        x = imgWidth - marginX;
        textAlign = 'right';
      }

      targetCtx.textAlign = textAlign;

      lines.forEach((lineText, idx) => {
        let y = marginY;
        if (isTop) {
          targetCtx.textBaseline = 'top';
          y = marginY + (idx * lineHeight);
        } else {
          targetCtx.textBaseline = 'bottom';
          y = imgHeight - marginY - ((lines.length - 1 - idx) * lineHeight);
        }

        targetCtx.strokeText(lineText, x, y);
        targetCtx.fillText(lineText, x, y);
      });
    }

    targetCtx.restore();
  }

  const offscreenCanvas = document.createElement('canvas');

  function renderMainView() {
    if (loadedFilesData.length === 0) {

      const hasExif = item.exifObj.cameraLens || item.exifObj.settings;
      singleExifBox.innerHTML = hasExif 
        ? `<b style="color:#111;">[${t.exifDetected}]</b><br>${item.exifObj.cameraLens ? item.exifObj.cameraLens + '<br>' : ''}${item.exifObj.settings}`
        : `<b style="color:#111;">[EXIF]</b><br>${t.noExif}`;
    } else {
      lblGridHeader.textContent = t.gridHeaderMulti;
      singleCanvasContainer.style.display = 'none';
      singleExifBox.style.display = 'none';

      thumbnailGrid.style.display = 'grid';
      thumbnailGrid.innerHTML = '';

      loadedFilesData.forEach((item, index) => {
        drawWatermarkToCanvas(offscreenCanvas, offscreenCtx, item.img, item.exifObj);

        const thumbCard = document.createElement('div');
        thumbCard.className = 'thumb-card';
        
        const imgEl = document.createElement('img');
        imgEl.src = offscreenCanvas.toDataURL('image/jpeg', 0.6);

        const overlay = document.createElement('div');
        overlay.className = 'thumb-overlay';
        overlay.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>`;

        const removeBtn = document.createElement('button');
        removeBtn.className = 'thumb-remove-btn';
        removeBtn.setAttribute('title', 'Remove image');
        removeBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;

        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteItemByIndex(index);
        });

        thumbCard.appendChild(imgEl);
        thumbCard.appendChild(overlay);
        thumbCard.appendChild(removeBtn);

        thumbCard.addEventListener('click', () => {
          openModal(index);
        });

        thumbnailGrid.appendChild(thumbCard);
      });

      if (activeModalIndex !== null) {
        updateModalContent(activeModalIndex);
      }
    }
  }

  function openModal(index) {
    activeModalIndex = index;
    updateModalContent(index);
    previewModal.style.display = 'flex';
  }

  function closeModal() {
    previewModal.style.display = 'none';
    activeModalIndex = null;
  }

  function updateModalContent(index) {
    const item = loadedFilesData[index];
    if (!item) return;

    drawWatermarkToCanvas(modalCanvas, modalCtx, item.img, item.exifObj);

    const t = translations[currentLang];
    const hasExif = item.exifObj.cameraLens || item.exifObj.settings;

    modalExifInfo.innerHTML = hasExif
      ? `<b>[${t.exifDetected}]</b> ${item.exifObj.cameraLens ? item.exifObj.cameraLens + ' ' : ''}${item.exifObj.settings}`
      : `<b>[EXIF]</b> ${t.noExif}`;
  }

  modalCloseBtn.addEventListener('click', closeModal);
  previewModal.addEventListener('click', (e) => {
    if (e.target === previewModal) closeModal();
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && activeModalIndex !== null) {
      closeModal();
    }
  });

  upload.addEventListener('change', (e) => {
    processFiles(e.target.files);
    e.target.value = '';
  });

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    fileLabel.addEventListener(eventName, (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, false);
  });

  ['dragenter', 'dragover'].forEach(eventName => {
    fileLabel.addEventListener(eventName, () => fileLabel.classList.add('dragover'), false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    fileLabel.addEventListener(eventName, () => fileLabel.classList.remove('dragover'), false);
  });

  fileLabel.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    processFiles(dt.files);
  });

  window.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;

    const imageFiles = [];
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        const file = items[i].getAsFile();
        if (file) {
          const pasteFile = new File([file], `pasted_image_${Date.now()}_${i}.png`, { type: file.type });
          imageFiles.push(pasteFile);
        }
      }
    }

    if (imageFiles.length > 0) {
      processFiles(imageFiles);
    }
  });

  const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

  downloadBtn.addEventListener('click', async () => {
    if (loadedFilesData.length === 0) return;

    const quality = parseFloat(qualitySlider.value) / 100;
    downloadBtn.disabled = true;
    const t = translations[currentLang];

    const baseTimestamp = Date.now();
    const downloadCanvas = document.createElement('canvas');
    const downloadCtx = downloadCanvas.getContext('2d');

    for (let i = 0; i < loadedFilesData.length; i++) {
      const item = loadedFilesData[i];
      
      downloadBtnText.textContent = t.btnDownloading.replace('{i}', i + 1).replace('{total}', loadedFilesData.length);

      drawWatermarkToCanvas(downloadCanvas, downloadCtx, item.img, item.exifObj);

      const link = document.createElement('a');
      link.download = `watermarked_${baseTimestamp + i}.jpg`;
      link.href = downloadCanvas.toDataURL('image/jpeg', quality);
      link.click();

      if (i < loadedFilesData.length - 1) {
        await delay(300);
      }
    }

    updateDownloadBtnText();
    downloadBtn.disabled = false;
  });

  applyLanguage(currentLang);
</script>

</body>
</html>
